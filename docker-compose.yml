services:
  db:
    image: postgres:16-alpine
    container_name: home_services_db
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: home_services
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d home_services"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
